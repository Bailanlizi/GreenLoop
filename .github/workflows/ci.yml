name: CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campus_trade_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Initialize test schema
        run: |
          sed 's/USE campus_trade;/USE campus_trade_test;/' campus-trade-api/src/main/resources/campus_trade.sql | mysql -h 127.0.0.1 -uroot -proot
          mysql -h 127.0.0.1 -uroot -proot campus_trade_test < scripts/stage2_finance_migration.sql
      - name: Run backend tests
        working-directory: campus-trade-api
        env:
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_REDIS_HOST: 127.0.0.1
          SPRING_REDIS_PORT: 6379
        run: mvn -B test

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [campus-trade-web, campus-trade-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Build ${{ matrix.directory }}
        working-directory: ${{ matrix.directory }}
        run: |
          npm ci
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --tag greenloop-api:ci ./campus-trade-api
      - name: Build web image
        run: docker build --tag greenloop-web:ci ./campus-trade-web
      - name: Build admin image
        run: docker build --tag greenloop-admin:ci ./campus-trade-admin
