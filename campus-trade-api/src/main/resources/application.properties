# ============================================================
# GreenLoop · 共享配置（受版本控制，不含任何敏感信息）
# 本地特有/敏感配置（数据库账号、邮箱授权码、AI key 等）请写在
# 被 .gitignore 忽略的 application.yml 中，勿提交到本仓库。
# 本文件与 application.yml 的 key 零重叠：本文件优先级更高，
# 且同名 key 不会被 application.yml 覆盖。
# ============================================================

# ---------- 服务基础 ----------
server.port=8080
spring.application.name=campus-trade-api

# ---------- 数据源（url/账号/密码见本地 application.yml，CI 由环境变量 SPRING_DATASOURCE_* 提供）----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 连接池（压测验证：Pool=30 消除 50 并发吞吐拐点，见 docs/支付接口压测报告.md）
spring.datasource.hikari.maximum-pool-size=30

# ---------- Redis（host/port/database 默认值；password 见本地 application.yml）----------
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0

# ---------- 文件上传与静态资源 ----------
# 相对路径，启动时按工作目录（campus-trade-api/）解析为绝对路径并自动创建
file.upload-dir=uploads/
file.max-upload-size=5MB
spring.web.resources.static-locations=file:${file.upload-dir}/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- 邮件（账号/授权码为本地敏感项，见 application.yml；测试环境在 application-test.yml 提供假账号）----------
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ---------- MyBatis ----------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ---------- JWT（生产环境务必通过环境变量 JWT_SECRET 覆盖默认值）----------
jwt.secret=${JWT_SECRET:greenloop-dev-secret-please-override-in-prod-2026-keep-long-enough}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- 日志 ----------
logging.level.com.campus.trade.mapper=debug

# ---------- 安全（本地特有覆盖项见 application.yml）----------
security.cors.allowed-origins=http://localhost:5173,http://localhost:8000
security.verification-code.send-cooldown-seconds=60
security.verification-code.max-sends-per-hour=5
