# 测试 profile 专用配置（受版本控制）
# 共享默认值来自 application.properties；此处只覆盖测试环境需要的差异项。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_trade_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai

  redis:
    database: 1

  # EmailServiceImpl 的 @Value("${spring.mail.username}") 为必填项；
  # 测试环境不真正发信（测试类内联 spring.mail.host=localhost），故使用占位假账号
  mail:
    username: greenloop-test@localhost

file:
  upload-dir: uploads-test

ai:
  enabled: false

security:
  bootstrap-admin:
    enabled: false
