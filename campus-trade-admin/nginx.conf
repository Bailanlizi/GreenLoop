server {
    listen 80;
    server_name _;

    location = / {
        return 302 /admin/;
    }
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
}
